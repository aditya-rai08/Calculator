<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="display"></div>
        <div id="controls">
            <div class="key special" id="backspace"><img id="back" src="image.png" alt="back"></div>
            <div class="key special" id="clear">AC</div>
            <div class="key special operator">%</div>
            <div class="key operator">/</div>
            <div class="key number">7</div>
            <div class="key number">8</div>
            <div class="key number">9</div>
            <div class="key operator">X</div>
            <div class="key number">4</div>
            <div class="key number">5</div>
            <div class="key number">6</div>
            <div class="key operator">-</div>
            <div class="key number">1</div>
            <div class="key number">2</div>
            <div class="key number">3</div>
            <div class="key operator">+</div>
            <div class="key">+/-</div>
            <div class="key number">0</div>
            <div class="key">.</div>
            <div class="key" id="result">=</div>

            
        </div>
    </div>
</body>
</html>
